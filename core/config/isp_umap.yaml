# =============================================================================
# ISP UMAP Generator Configuration
# Path: /app/core/config/isp_umap.yaml
# =============================================================================

paths:
  # Path to tokenized HuggingFace dataset
  dataset: /app/data/AsanoPIPand3and5w/tokenized_dataset/AsanoPIPand3and5w_0.dataset
  # Path to the fine-tuned Geneformer model
  geneformer_model: /app/output/20260422/finetune_004752_215426Z/all_run1

umap:
  # Random seed for UMAP and for random/stratified cell sampling
  seed: 42
  # UMAP parameters
  n_neighbors: 15
  min_dist: 0.1
  # How many trajectories (grey arrows) to draw from Start -> Perturbed Start
  num_trajectory_arrows: 100
  # Maximum cells to extract per state to prevent memory limits
  max_cells_per_state: 2000
  # How to pick those cells within each state:
  #   head        — first N rows (legacy / dataset-order dependent)
  #   random      — shuffle then take N
  #   stratified  — balance across sample_key groups (recommended)
  sampling: stratified
  # Column used for stratified sampling (falls back to random with a warning if missing)
  sample_key: sample_id

perturbation:
  # Gene to perturb. Accepts Ensembl ID (e.g. ENSMUSG00000029580) or Gene Symbol (e.g. Actb)
  gene_to_perturb: Actb
  # Perturbation type: delete | overexpress | inhibit | activate
  #   delete: remove gene from rank value encoding (only type implemented in ISP UMAP today)
  #   overexpress: move gene to front of rank value encoding
  #   inhibit: move gene to lower quartile of rank value encoding
  #   activate: move gene to higher quartile of rank value encoding
  type: delete 
  
  # Dataset column specifying the cell condition
  state_key: disease
  # The starting cell condition (the one being perturbed)
  start_state: AD
  # The goal/target condition (the one to compare against)
  end_state: WT

runtime:
  # Number of labels output by the finetuned Sequence Classification model
  num_classes: 2
  # Batch size for dataset mapping processes
  batch_size: 100

# After the main UMAP + per_cell_isp_shift.csv, also write cluster_coexpr_analysis/:
#   umap_joint_l2_cluster_celltype.png, l2_by_coarse_celltype.png,
#   l2_mean_by_coarse_celltype.png, per_cell_cluster_l2_celltype.csv
# Set enabled: false (or postprocess: false) to skip.
postprocess:
  enabled: true
  # KMeans clusters when annotation CSV has no cluster labels (joint overlays)
  n_clusters: 4
  # Marker-gene cell-type prediction on start-state cells (writes pred_cell_type / coarse_type)
  celltype_prediction: true
